<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcon Contracting - Project Showcase Slider</title>
  <link rel="stylesheet" href="main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d1e22;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .standalone-slider {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="standalone-slider">
    <div id="heroSlider" class="slider-container" aria-label="Falcon Construction Works">
      <div class="slider-track">
        <div class="slide-item active">
          <img src="data1/images/im_big_1.jpg" alt="Civil Construction Project 1">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_2.jpg" alt="Civil Construction Project 2">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_3.jpg" alt="Civil Construction Project 3">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_4.jpg" alt="Civil Construction Project 4">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_5.jpg" alt="Civil Construction Project 5">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_6.jpg" alt="Civil Construction Project 6">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_7.jpg" alt="Civil Construction Project 7">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_8.jpg" alt="Civil Construction Project 8">
        </div>
        <div class="slide-item">
          <img src="data1/images/im_big_9.jpg" alt="Civil Construction Project 9">
        </div>
      </div>

      <button class="slider-arrow slider-prev" aria-label="Previous Slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="slider-arrow slider-next" aria-label="Next Slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div class="slider-dots">
        <button class="slider-dot active" data-slide="0" aria-label="Slide 1"></button>
        <button class="slider-dot" data-slide="1" aria-label="Slide 2"></button>
        <button class="slider-dot" data-slide="2" aria-label="Slide 3"></button>
        <button class="slider-dot" data-slide="3" aria-label="Slide 4"></button>
        <button class="slider-dot" data-slide="4" aria-label="Slide 5"></button>
        <button class="slider-dot" data-slide="5" aria-label="Slide 6"></button>
        <button class="slider-dot" data-slide="6" aria-label="Slide 7"></button>
        <button class="slider-dot" data-slide="7" aria-label="Slide 8"></button>
        <button class="slider-dot" data-slide="8" aria-label="Slide 9"></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
